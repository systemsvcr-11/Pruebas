<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Corporativo - Módulos</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      background: radial-gradient(circle at 80% 20%, #1e1b4b 0%, #0f172a 45%, #020617 100%);
    }
    .app-card:hover .app-icon-box {
      transform: translateY(-4px) scale(1.04);
      box-shadow: 0 12px 24px -6px rgba(0, 0, 0, 0.45);
    }
  </style>
</head>
<body class="min-h-screen text-slate-100 flex flex-col font-sans select-none antialiased">

  <!-- ================= VISTA LOGIN ================= -->
  <div id="view-login" class="flex-1 flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-slate-900/80 backdrop-blur-xl border border-slate-800 rounded-2xl p-8 shadow-2xl">
      <div class="flex justify-center mb-6">
        <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center shadow-lg shadow-indigo-500/30">
          <i data-lucide="layout-grid" class="w-8 h-8 text-white"></i>
        </div>
      </div>
      <h2 class="text-2xl font-bold text-center text-white mb-1">Bienvenido a MooLog!</h2>
      <p class="text-slate-400 text-sm text-center mb-8">Ingresa tus credenciales</p>

      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Usuario</label>
          <input type="email" id="login-email" required
            class="w-full px-4 py-2.5 bg-slate-800/80 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all text-sm"
            placeholder="usuario@dominio.com">
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Contraseña</label>
          <input type="password" id="login-password" required
            class="w-full px-4 py-2.5 bg-slate-800/80 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all text-sm"
            placeholder="••••••••">
        </div>
        <p id="login-error" class="text-rose-400 text-xs hidden"></p>
        <button type="submit" id="login-btn"
          class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 active:scale-[0.99] text-white font-medium rounded-xl transition-all shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-2 text-sm mt-2">
          <span>Iniciar Sesión</span>
          <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </button>
      </form>
    </div>
  </div>

  <!-- ================= VISTA DASHBOARD (ESTILO ODOO) ================= -->
  <div id="view-dashboard" class="flex-1 flex flex-col hidden">
    <!-- Barra Superior -->
    <header class="h-14 px-6 flex items-center justify-between border-b border-white/5 bg-slate-950/40 backdrop-blur-md">
      <div class="flex items-center gap-3">
        <div class="w-7 h-7 rounded-lg bg-indigo-600 flex items-center justify-center">
          <i data-lucide="boxes" class="w-4 h-4 text-white"></i>
        </div>
        <span class="font-semibold text-sm tracking-wide text-slate-200">Módulos Corporativos</span>
      </div>

      <div class="flex items-center gap-4">
        <span id="user-display" class="text-xs text-slate-400">usuario</span>
        <button id="logout-btn" title="Cerrar Sesión"
          class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white transition-colors">
          <i data-lucide="log-out" class="w-4 h-4"></i>
        </button>
      </div>
    </header>

    <!-- Grid de Aplicaciones -->
    <main class="flex-1 flex flex-col items-center justify-center p-6 md:p-12">
      <!-- Buscador rápido en tiempo real -->
      <div class="w-full max-w-xs mb-10">
        <div class="relative">
          <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-3"></i>
          <input type="text" id="app-search" placeholder="Buscar módulo..."
            class="w-full pl-9 pr-4 py-2 bg-slate-900/60 border border-slate-700/60 rounded-full text-xs text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 backdrop-blur-sm transition-all">
        </div>
      </div>

      <!-- Cuadrícula de iconos tipo Odoo -->
      <div id="apps-container" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-x-8 gap-y-10 max-w-5xl justify-items-center">
        <!-- Renderizado dinámico vía JavaScript -->
      </div>
    </main>
  </div>

  <script>
// ================= CONFIGURACIÓN SUPABASE =================
    const SUPABASE_URL = "https://hhxoxnhjolfmywywimlp.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_XxAR4ue0cFwr8p1pfh9T-w_nuPMbbi3";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ================= LISTADO DE TUS APPS =================
    // Aquí registras todas tus apps con su link directo
    const MIS_APPS = [
      {
        id: "Moolog",
        nombre: "Moolog!",
        url: "https://systemsvcr-11.github.io/MooLog/",
        icono: "package",
        colorGradiente: "bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-green-300 via-blue-500 to-purple-600"
      },
      {
        id: "Gestionpersonal",
        nombre: "Gestion Personal",
        url: "https://systemsvcr-11.github.io/Gestion-Personal/#",
        icono: "user-group",
        colorGradiente: "from-pink-500 to-rose-600"
      },
      {
        id: "Requerimientos",
        nombre: "Requerimientos",
        url: "https://hojarecepcionalm-lb.onrender.com/",
        icono: "layers-arrow-down",
        colorGradiente: "from-emerald-500 to-teal-600",
        requiereSSO: false
      },
      {
        id: "Recetascp",
        nombre: "Recetas CP",
        url: "https://systemsvcr-11.github.io/RecetasCP/",
        icono: "cooking-pot",
        colorGradiente: "bg-gradient-to-t from-yellow-200 via-yellow-400 to-yellow-700"
      },
      {
        id: "Finanzas",
        nombre: "Finanzas",
        url: "https://control-compras-web.onrender.com/",
        icono: "landmark",
        colorGradiente: "from-blue-500 to-indigo-600",
        colorGradiente: "bg-gradient-to-r from-pink-300 via-purple-300 to-indigo-400",
        requiereSSO: false
      }      
    ];

    // ================= CONTROL DE ESTADO =================
    const viewLogin = document.getElementById("view-login");
    const viewDashboard = document.getElementById("view-dashboard");
    const loginForm = document.getElementById("login-form");
    const loginError = document.getElementById("login-error");
    const userDisplay = document.getElementById("user-display");
    const logoutBtn = document.getElementById("logout-btn");
    const appsContainer = document.getElementById("apps-container");
    const appSearch = document.getElementById("app-search");

    // Verificar si ya hay una sesión activa al abrir la página
    async function checkAuth() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        mostrarDashboard(session);
      } else {
        mostrarLogin();
      }
    }

    function mostrarLogin() {
      viewLogin.classList.remove("hidden");
      viewDashboard.classList.add("hidden");
      lucide.createIcons();
    }

    function mostrarDashboard(session) {
      viewLogin.classList.add("hidden");
      viewDashboard.classList.remove("hidden");
      userDisplay.textContent = session.user.email;
      renderApps(MIS_APPS);
      lucide.createIcons();
    }

    // Dibujar los iconos estilo Odoo
    function renderApps(apps) {
      appsContainer.innerHTML = "";
      apps.forEach(app => {
        const card = document.createElement("div");
        card.className = "app-card flex flex-col items-center cursor-pointer group transition-all";
        card.innerHTML = `
          <div class="app-icon-box w-20 h-20 rounded-2xl bg-gradient-to-tr ${app.colorGradiente} flex items-center justify-center shadow-lg shadow-black/40 border border-white/10 transition-transform duration-200">
            <i data-lucide="${app.icono}" class="w-9 h-9 text-white drop-shadow"></i>
          </div>
          <span class="mt-3 text-xs font-medium text-slate-300 group-hover:text-white transition-colors text-center tracking-wide">
            ${app.nombre}
          </span>
        `;
        card.addEventListener("click", () => {
          if (app.requiereSSO) {
            abrirAppConSSO(app.url);
          } else {
            // Navegación limpia directa (en la misma pestaña)
            window.location.href = app.url;
          }
        });

        appsContainer.appendChild(card);
      });
      lucide.createIcons();
    }

    // ================= MECANISMO DE LANZAMIENTO SSO SEGURO =================
    // Variable en memoria para almacenar las credenciales de la sesión activa del portal
    // Recuperar de sessionStorage si el usuario recarga la página (F5)
    let credencialesActivas = {
      usuario: sessionStorage.getItem("portal_auth_user") || "",
      clave: sessionStorage.getItem("portal_auth_pass") || ""
    };

    // 1. Envío de Login (ÚNICO LISTENER)
    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      loginError.classList.add("hidden");

      const email = document.getElementById("login-email").value.trim();
      const password = document.getElementById("login-password").value;

      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

      if (error) {
        loginError.textContent = "Credenciales inválidas o error de conexión.";
        loginError.classList.remove("hidden");
      } else {
        // Guardar credenciales en memoria y en sessionStorage para sobrevivir a recargas (F5)
        credencialesActivas = { usuario: email, clave: password };
        sessionStorage.setItem("portal_auth_user", email);
        sessionStorage.setItem("portal_auth_pass", password);

        mostrarDashboard(data.session);
      }
    });

    // 2. Función para abrir el módulo y pasar credenciales en la misma pestaña
    function abrirAppConSSO(targetUrl) {
      if (!credencialesActivas.usuario || !credencialesActivas.clave) {
        alert("Por seguridad, inicia sesión nuevamente para sincronizar los módulos.");
        mostrarLogin();
        return;
      }

      // 1. Empaquetar credenciales en Base64 seguro para URL
      const payload = JSON.stringify({
        u: credencialesActivas.usuario,
        p: credencialesActivas.clave,
        t: Date.now() // timestamp de validez
      });
      const token = btoa(unescape(encodeURIComponent(payload)));

      // 2. Limpiar la URL destino y añadir el token en el HASH (#)
      const baseUrl = targetUrl.split('#')[0].replace(/\/+\$/, '') + '/';
      window.location.href = `${baseUrl}#sso=${token}`;
    }

    // 3. Cerrar sesión (ÚNICO LISTENER Y LIMPIEZA COMPLETA)
    logoutBtn.addEventListener("click", async () => {
      // Limpiar memoria local
      credencialesActivas = { usuario: "", clave: "" };
      sessionStorage.removeItem("portal_auth_user");
      sessionStorage.removeItem("portal_auth_pass");
      sessionStorage.removeItem("sso_temp_user");
      sessionStorage.removeItem("sso_temp_pass");
      localStorage.removeItem("packflow_session");

      // Cerrar sesión en Supabase
      await supabaseClient.auth.signOut();
      mostrarLogin();
    });


    // 4. Buscador interactivo
    appSearch.addEventListener("input", (e) => {
      const q = e.target.value.toLowerCase();
      const filtradas = MIS_APPS.filter(a => a.nombre.toLowerCase().includes(q));
      renderApps(filtradas);
    });

    // 5. Comprobación inicial de sesión
    checkAuth();
  </script>
</body>
</html>
